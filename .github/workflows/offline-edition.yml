name: Offline Edition

on:
  workflow_dispatch:
  push:
    paths:
      - "CONTENT/**"
      - "IMPLEMENTATION/**"
      - "REFERENCE/**"
      - "RELEASE/**"
      - ".github/workflows/offline-edition.yml"
  pull_request:
    paths:
      - "CONTENT/**"
      - "IMPLEMENTATION/**"
      - "REFERENCE/**"
      - "RELEASE/**"
      - ".github/workflows/offline-edition.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install reference implementation
        run: pip install -e "REFERENCE[test]"
      - name: Validate offline record identities
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path
          root = Path("CONTENT/vertical-slices")
          seen = defaultdict(list)
          for path in sorted(root.glob("*/records/*.json")):
              record = json.loads(path.read_text(encoding="utf-8"))
              key = (record["record_id"], record["record_version"])
              seen[key].append(str(path))
          duplicates = {key: paths for key, paths in seen.items() if len(paths) > 1}
          if duplicates:
              print("Duplicate record identities detected:")
              for key, paths in sorted(duplicates.items()):
                  print(f"  {key[0]} @ version {key[1]}")
                  for path in paths:
                      print(f"    - {path}")
              raise SystemExit(1)
          print(f"Validated {len(seen)} unique record identities.")
          PY
      - name: Test offline edition
        run: pytest -q REFERENCE/tests/test_offline_edition.py
      - name: Build full offline edition
        run: python REFERENCE/build_offline_edition.py --output offline-edition
      - name: Verify generated manifest
        run: python -c "import json; m=json.load(open('offline-edition/edition-manifest.json')); assert m['network_required'] is False and m['record_count']==json.load(open('RELEASE/CONTENT-COVERAGE.json'))['total_records']"
      - name: Upload offline edition
        uses: actions/upload-artifact@v4
        with:
          name: encyclopedia-offline-edition
          path: offline-edition/
