name: MVP SI Units Private Review Preview

on:
  pull_request:
    branches:
      - mvp-public-contribution-design-2026-10-11
    paths:
      - "CONTENT/vertical-slices/si-units-basics/records/**"
      - "REFERENCE/build_si_units_private_review_preview.py"
      - "REFERENCE/fixtures/si-units-private-review-manifest.json"
      - "REFERENCE/tests/browser_inspect_si_units_private_preview.cjs"
      - "REFERENCE/src/encyclopedia_reference/public_reader.py"
      - ".github/workflows/mvp-si-private-review-preview.yml"

permissions:
  contents: read

concurrency:
  group: mvp-si-private-review-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-private-review-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact pull-request merge revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: |
          python -m pip install pytest
      - name: Run reader security and allowlist tests
        env:
          PYTHONPATH: REFERENCE/src
        run: python -m pytest -q REFERENCE/tests/test_public_reader.py
      - name: Build exact SI private review preview
        env:
          PYTHONPATH: REFERENCE/src
        run: |
          python REFERENCE/build_si_units_private_review_preview.py \
            --source-revision "${GITHUB_SHA}" \
            --output /tmp/mvp-si-private-review-preview
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path("/tmp/mvp-si-private-review-preview")
          manifest = json.loads((root / "preview-manifest.json").read_text(encoding="utf-8"))
          expected = {
              ("CLM-SI-SEVEN-BASE", "1"),
              ("EU-SI-SEVEN-BASE", "2"),
              ("CLM-SI-DERIVED", "1"),
              ("EU-SI-DERIVED", "2"),
              ("SRC-NIST-SI-UNITS", "1"),
              ("CTX-SI", "1"),
              ("SCP-SI", "1"),
          }
          actual = {(x["record_id"], x["record_version"]) for x in manifest["selected_records"]}
          assert actual == expected, (actual, expected)
          assert manifest["record_count"] == 7
          assert manifest["source_revision"] == os.environ["GITHUB_SHA"]
          assert manifest["edition_state"] == "preview"
          assert manifest["redistribution_allowed"] is False
          assert manifest["network_required"] is False
          assert len(manifest["selected_record_hashes"]) == 7
          page = (root / "index.html").read_text(encoding="utf-8")
          assert "CLM-SI-SEVEN-BASE" in page and "CLM-SI-DERIVED" in page
          assert "CLM-SI-ACCURACY-BOUNDARY" not in page
          assert "22" in page
          assert "не является редакционным одобрением" in page.casefold()
          print(json.dumps({
              "result": "PASS",
              "source_revision": manifest["source_revision"],
              "record_count": manifest["record_count"],
              "selected_records": manifest["selected_records"],
              "input_record_hashes": len(manifest["selected_record_hashes"]),
              "redistribution_allowed": manifest["redistribution_allowed"],
              "network_required": manifest["network_required"]
          }, ensure_ascii=False, indent=2))
          PY
      - name: Install Chromium for real-browser inspection
        run: |
          npm init -y
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Inspect exact SI preview in desktop and mobile Chromium
        run: |
          node REFERENCE/tests/browser_inspect_si_units_private_preview.cjs \
            /tmp/mvp-si-private-review-preview /tmp/mvp-si-browser-inspection
      - name: Upload private SI review preview and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp-si-private-review-preview-${{ github.sha }}
          path: |
            /tmp/mvp-si-private-review-preview/index.html
            /tmp/mvp-si-private-review-preview/search.js
            /tmp/mvp-si-private-review-preview/preview-manifest.json
            /tmp/mvp-si-browser-inspection/
          if-no-files-found: warn
          retention-days: 14
