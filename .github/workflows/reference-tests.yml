name: Reference implementation tests

on:
  workflow_dispatch:
  push:
  pull_request:
    paths:
      - "REFERENCE/**"
      - "IMPLEMENTATION/005-RECORD-SCHEMA.json"
      - "CONTENT/**"
      - "ROADMAP.md"
      - "RELEASE/CONTENT-COVERAGE.json"

concurrency:
  group: reference-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-reference:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e "REFERENCE[test]"
      - name: Content preflight
        run: python REFERENCE/preflight_content.py
      - name: Generate M13 claim audit worksheet
        run: python REFERENCE/m13_claim_audit_inventory.py --output-dir /tmp/m13-claim-audit-worksheet
      - name: Upload M13 claim audit worksheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m13-claim-audit-worksheet
          path: /tmp/m13-claim-audit-worksheet/
          if-no-files-found: warn
      - name: Generate M13 scored-claim reconciliation ledger
        run: python REFERENCE/m13_claim_scored_report_ledger.py --output-dir /tmp/m13-claim-audit-ledger
      - name: Upload M13 scored-claim reconciliation ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m13-scored-claim-reconciliation-ledger
          path: /tmp/m13-claim-audit-ledger/
          if-no-files-found: error
      - name: Generate M13 evidence-linkage audit
        run: python REFERENCE/m13_evidence_linkage_audit.py --output-dir /tmp/m13-evidence-linkage-audit
      - name: Upload M13 evidence-linkage audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m13-evidence-linkage-audit
          path: /tmp/m13-evidence-linkage-audit/
          if-no-files-found: error
      - name: Run reference tests
        id: reference_tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pytest -q REFERENCE/tests 2>&1 | tee /tmp/reference-tests.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish CI diagnostic summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Reference CI diagnostic"
            echo "- Commit: `${GITHUB_SHA}`"
            echo "- Run: #${GITHUB_RUN_NUMBER}"
            echo "- Workflow: ${GITHUB_WORKFLOW}"
            echo "- Test exit code: `${{ steps.reference_tests.outputs.status }}`"
            echo
            echo "### Corpus preflight"
            python REFERENCE/preflight_content.py || true
            echo
            echo "### Pytest result"
            tail -n 12 /tmp/reference-tests.log || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce reference test result
        if: always()
        shell: bash
        run: test "${{ steps.reference_tests.outputs.status }}" = "0"
