name: Reference implementation tests

on:
  push:
    paths:
      - "REFERENCE/**"
      - "IMPLEMENTATION/005-RECORD-SCHEMA.json"
  pull_request:
    paths:
      - "REFERENCE/**"
      - "IMPLEMENTATION/005-RECORD-SCHEMA.json"

jobs:
  test-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e REFERENCE
      - run: python -m pytest -q REFERENCE/tests
