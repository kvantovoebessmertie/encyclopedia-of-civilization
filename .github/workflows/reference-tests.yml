name: Reference implementation tests

on:
  push:
    paths:
      - "REFERENCE/**"
      - "IMPLEMENTATION/005-RECORD-SCHEMA.json"
      - "CONTENT/**"
      - "ROADMAP.md"
      - "RELEASE/CONTENT-COVERAGE.json"
  pull_request:
    paths:
      - "REFERENCE/**"
      - "IMPLEMENTATION/005-RECORD-SCHEMA.json"
      - "CONTENT/**"
      - "ROADMAP.md"
      - "RELEASE/CONTENT-COVERAGE.json"

concurrency:
  group: reference-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-reference:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e "REFERENCE[test]"
      - name: Content preflight
        run: python REFERENCE/preflight_content.py
      - run: python -m pytest -q REFERENCE/tests
