name: Release Conformance Gate

on:
  push:
    branches: [ main, master ]
    paths:
      - "IMPLEMENTATION/**"
      - "REFERENCE/**"
      - "RELEASE/**"
      - "CONTENT/**"
      - "ROADMAP.md"
      - ".github/workflows/release-gate.yml"
  pull_request:
    paths:
      - "IMPLEMENTATION/**"
      - "REFERENCE/**"
      - "RELEASE/**"
      - "CONTENT/**"
      - "ROADMAP.md"
      - ".github/workflows/release-gate.yml"
  workflow_dispatch:

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install reference implementation
        run: python -m pip install -e REFERENCE[test]

      - name: Run release gate
        run: python REFERENCE/release_gate.py

      - name: Upload release gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-report
          path: RELEASE/release-gate-report.json
          if-no-files-found: error
